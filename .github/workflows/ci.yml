name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.4"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage

  build-android:
    name: Build Android APK
    needs: [analyze, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Decode google-services.json
        run: |
          set -euo pipefail
          secret="${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}"
          if [ -z "$secret" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; skipping google-services.json (no Firebase Gradle plugin is applied)."
            exit 0
          fi
          mkdir -p android/app
          printf '%s' "$secret" | base64 -d > android/app/google-services.json
          if ! head -c 1 android/app/google-services.json | grep -q '{'; then
            echo "Decoded google-services.json does not look like JSON; refusing to use it." >&2
            exit 1
          fi
      - run: flutter pub get
      - name: Build APK
        id: build_apk
        run: |
          set -o pipefail
          flutter build apk --release --verbose \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            2>&1 | tee build-apk.log
      - name: Surface build log on failure
        if: always() && steps.build_apk.outcome == 'failure'
        run: |
          {
            echo "## Build APK failure log (last 400 lines)"
            echo
            echo '```'
            tail -n 400 build-apk.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post failure log as commit comment
        if: always() && steps.build_apk.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const all = fs.readFileSync('build-apk.log', 'utf8').split('\n');
            // Strip the verbose `[ +123 ms]` prefix Flutter adds so the raw
            // gradle/kotlinc lines are easier to scan.
            const stripped = all.map(l => l.replace(/^\[\s*[+\-]?\d+\s*m?s?\]\s?/, ''));
            const errorRe = /^(e:|w:|error:|FAILURE:|Caused by:|>\s*Task\s+:sentry|Compilation error|Unresolved reference|incompatible|Symbol not found)/;
            const errorIdxs = [];
            stripped.forEach((l, i) => { if (errorRe.test(l)) errorIdxs.push(i); });
            const ctx = new Set();
            errorIdxs.forEach(i => {
              for (let j = Math.max(0, i - 5); j < Math.min(stripped.length, i + 15); j++) ctx.add(j);
            });
            const focused = [...ctx].sort((a,b)=>a-b)
              .map(i => stripped[i]).join('\n').slice(-30000);
            const tail = stripped.slice(-200).join('\n').slice(-25000);
            const body = [
              '### Build APK failure (run ' + context.runId + ')',
              '',
              '#### Focused error context',
              '```',
              focused || '(no error markers matched; see tail below)',
              '```',
              '',
              '#### Tail (last 200 lines)',
              '```',
              tail,
              '```',
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-apk.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  distribute-android:
    name: Firebase App Distribution (Android)
    needs: [build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/
      - name: Write Firebase service account credentials
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/firebase-service-account.json"
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFile: ${{ runner.temp }}/firebase-service-account.json
          groups: ${{ vars.FIREBASE_TESTER_GROUPS || 'internal-testers' }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
